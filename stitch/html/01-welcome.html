<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — [App Name]</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#F7F3EC',
            ink: '#1C1A17',
            'ink-muted': '#6B655C',
            evergreen: '#2F4F43',
            'evergreen-dark': '#233d34',
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#F7F3EC] text-[#1C1A17] font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-[#2F4F43]/15 selection:text-[#1C1A17]">
  <!-- Top Wordmark Bar -->
  <header class="w-full pt-12 pb-4 px-8 flex justify-center items-center">
    <span class="font-serif italic text-lg tracking-tight font-medium text-[#1C1A17] select-none">
      [App Name]
    </span>
  </header>

  <!-- Vertically Centered Main Editorial Content -->
  <main class="w-full max-w-md mx-auto px-7 flex-1 flex flex-col justify-center items-center text-center my-auto">
    <!-- Large Newsreader Headline -->
    <h1 class="font-serif text-[36px] leading-[1.18] font-normal tracking-tight text-[#1C1A17] mb-5 max-w-[320px] mx-auto text-balance">
      Meet the people who’ll shape your career.
    </h1>

    <!-- One Line Muted Body -->
    <p class="font-sans text-[15px] leading-relaxed text-[#6B655C] font-normal max-w-[310px] mx-auto mb-10">
      A professional network, built by and for ASU students.
    </p>

    <!-- Faint Italic Serif Prompt Snippet -->
    <div class="py-2.5 px-4 rounded-full border border-[#1C1A17]/10 bg-[#1C1A17]/[0.02]">
      <p class="font-serif italic text-[15px] text-[#6B655C]/90 font-light tracking-wide">
        “The project I'm most proud of…”
      </p>
    </div>
  </main>

  <!-- Bottom Actions -->
  <footer class="w-full max-w-md mx-auto px-7 pb-10 pt-4 flex flex-col items-center">
    <!-- Primary CTA: Evergreen Pill -->
    <button type="button" class="w-full py-4 px-6 rounded-full bg-[#2F4F43] hover:bg-[#233d34] active:scale-[0.99] text-[#F7F3EC] font-sans text-base font-medium tracking-tight transition duration-150 shadow-none focus:outline-none focus:ring-2 focus:ring-[#2F4F43] focus:ring-offset-2 focus:ring-offset-[#F7F3EC]">
      Continue with ASU email
    </button>

    <!-- Tertiary Text Link -->
    <button type="button" class="mt-4 text-[#2F4F43] hover:underline font-sans text-sm font-medium tracking-tight py-2 transition-colors duration-150 focus:outline-none">
      How it works
    </button>
  </footer>
</body>
</html>
